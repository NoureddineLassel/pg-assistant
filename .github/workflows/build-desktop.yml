# يبني نسخة ويندوز (exe) ونسخة ماك (dmg) على أجهزة GitHub المجانية.
# التشغيل: تبويب Actions ← "Build desktop apps" ← Run workflow. أو تلقائيا عند إنشاء وسم يبدأ بـ v (مثل v1.0.0).
# Builds the Windows installer (.exe) and the macOS disk image (.dmg) on GitHub-hosted machines.
name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build tools
        run: npm install --no-audit --no-fund

      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # no paid certificates: Windows build is unsigned, macOS build is ad-hoc signed
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: ADC-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 30
